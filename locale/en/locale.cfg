[entity-description]
asm45-corp-site=10 batches are needed: 1 iron plate, 1 copper plate, 1 steel plate and 1 electronic circuit each. One batch takes 2 seconds; after the tenth the site turns into the asm45_corp assembling machine and surplus resources burn away.
atmo-cond=Pumps atmospheric condensate out of clouds. Works only inside a cloud patch and outputs the fluid through a pipe.
sun-heat-exchanger=Cools everything within 8 tiles while it has water. Water is consumed continuously: without a supply it stops cooling and melts like any other building. Hover the exchanger to see the cooling zone; buildings under it show a cooling cloud, melting ones show a melting cloud.

[item-description]
asm45-corp-ready=A ready-made factory: places the assembling machine directly, with no construction site and no extra resources.
atmo-cond=Place it inside a cloud patch to pump atmospheric condensate.
sun-heat-exchanger=Place it on the platform and feed it water: everything within 8 tiles stops melting.

