[entity-description]
asm45-corp-site=Нужно 10 партий: по 1 железной плите, 1 медной, 1 стальной и 1 микросхеме в каждой. Партия занимает 2 секунды; после десятой площадка превращается в ассемблер asm45_corp, а лишние ресурсы сгорают.
atmo-cond=Качает атмосферный конденсат из облаков. Работает только в облачном пятне, жидкость выдаёт через трубу.

[item-description]
asm45-corp-ready=Готовый завод: ставится сразу, без стройплощадки и повторного завоза ресурсов.
atmo-cond=Ставится в облачное пятно и качает из него атмосферный конденсат.

